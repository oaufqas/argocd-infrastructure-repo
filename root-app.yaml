apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
spec:
  project: development
  source:
    repoURL: https://github.com/oaufqas/argocd-infrastructure-repo.git
    path: apps/app
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default

