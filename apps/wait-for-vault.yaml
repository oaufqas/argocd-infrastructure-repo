apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-vault
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
spec:
  template:
    spec:
      containers:
      - name: sleep
        image: cr.yandex/mirror/busybox
        command: ["/bin/sh", "-c", "sleep 300"]
      restartPolicy: Never
  backoffLimit: 0