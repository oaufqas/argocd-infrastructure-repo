apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/oaufqas/argocd-infrastructure-repo
    targetRevision: master
    path: charts/nfs-server
    helm: 
      values: |
        persistence: 
          enabled: true
          size: 4Gi
          storageClass: "yc-network-hdd"
        storageClass:
          name: nfs
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-system
  syncPolicy:
    automated:
      prune: true       # удалять ресурсы, если их нет в Git
      selfHeal: true    # исправлять ручные правки
    syncOptions:
      - CreateNamespace=true