apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/oaufqas/argocd-infrastructure-repo
    targetRevision: master
    path: charts/vault/
    helm:
      valueFiles:
        - values.prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m 
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
  ignoreDifferences:
    - kind: Secret
      jsonPointers:
        - /data
        - /stringData
    - kind: Secret
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - kind: Secret
      jsonPointers:
        - /metadata/resourceVersion
        - /metadata/uid
        - /metadata/creationTimestamp
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status