grafana:
  enabled: true
  adminPassword: "admin"
  plugins:
    - "victoriametrics-logs-datasource"
defaultDatasources:
  extra: 
    - name: VictoriaLogs
      type: victoriametrics-logs-datasource
      access: proxy
      url: http://logs-victoria-logs-single-server.monitoring:9428

vmsingle:
  enabled: true
  spec:
    retentionPeriod: "7d"
    storage:
      accessModes: ["ReadWriteOnce"]
      # storageClassName: "standard" # minikube
      storageClassName: "local-path" # k3s 
      resources:
        requests:
          storage: 2Gi
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
