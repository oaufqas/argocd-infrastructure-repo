apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-sa

---

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-store
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth: 
        kubernetes:
          role: "eso-role"
          mountPath: "kubernetes"
          serviceAccountRef:
            name: vault-sa

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
spec:
  ingressClassName: nginx
  rules:
    - host: "server"
      http:
        paths:
        - path: "/"
          pathType: Prefix
          backend:
            service:
              name: server-svc
              port:
                number: 5000

---

