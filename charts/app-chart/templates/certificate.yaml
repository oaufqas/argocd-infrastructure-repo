{{- if .Values.ssl.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ssl.certname }}
  namespace: default
spec:
  secretName: {{ .Values.ssl.secretname }}
  issuerRef:
    name: {{ .Values.ssl.issuername }}
    kind: ClusterIssuer
  commonName: {{ .Values.ssl.domain }}
  dnsNames:
  - {{ .Values.ssl.domain }}
{{- end}}